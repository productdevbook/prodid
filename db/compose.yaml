name: prodid

services:
  db:
    image: postgres:18.6-trixie
    container_name: prodid-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: prodid
      POSTGRES_PASSWORD: prodid
      POSTGRES_DB: prodid
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - prodid-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prodid -d prodid']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  prodid-pgdata:
