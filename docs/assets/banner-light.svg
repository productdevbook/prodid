<text x="60" y="6" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="40" font-weight="600" letter-spacing="-1">prodid</text>
</g>
<text x="64" y="136" font-size="21" fill="#5f6675">An open identity and data layer</text>
<text x="64" y="164" font-size="21" fill="#5f6675">for every physical product.</text>
<text x="1216" y="552" text-anchor="end" font-size="17" fill="#5f6675">Publishers state facts on their own domains.</text>
<text x="1216" y="578" text-anchor="end" font-size="17" fill="#5f6675">Every code resolves to one permanent <tspan fill="#2f5fae" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">opid</tspan>.</text>
<text x="1216" y="604" text-anchor="end" font-size="17" fill="#5f6675">The whole index is open to download.</text>
</g>
</svg>
